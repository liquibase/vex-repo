name: Trigger Trivy Scan

# Mirror of the source repos' vex-repo-dispatch.yml in the reverse
# direction: when published VEX content changes here, trigger the published
# image scans in liquibase-pro and liquibase-platform so the next scan picks
# up the new statements without waiting for the weekday cron.

on:
  push:
    branches: [main]
    paths:
      - 'pkg/**'
      - 'index.json'
      - 'vex-repository.json'
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: trigger-trivy-scan
  cancel-in-progress: true

jobs:
  trigger:
    name: Trigger published image scans in liquibase-pro and liquibase-platform
    runs-on: ubuntu-latest
    steps:
      - name: Get the GitHub App credentials from vault
        uses: liquibase/build-logic/.github/actions/setup-aws-vault@2003fece51886ec69cda3df1cb4520b3ceeb2e0c # main
        with:
          group: github-app-liquibase
          role-arn: ${{ secrets.VAULT_GROUPED_GITHUB_APP_LIQUIBASE_ROLE_ARN }}

      - name: Get GitHub App token (actions:write on liquibase-pro and liquibase-platform)
        id: get-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ env.LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            liquibase-pro
            liquibase-platform
          permission-actions: write

      - name: Dispatch trivy-scan-published-images.yml
        uses: liquibase/build-logic/.github/actions/dispatch-and-wait@2660ba32055efd3301bcf624a3d60ca8b11cc482 # main
        with:
          workflow: trivy-scan-published-images.yml
          repo: liquibase/liquibase-pro
          ref: main
          wait: 'false'
          gh-token: ${{ steps.get-token.outputs.token }}

      - name: Dispatch liquibase-platform scan-published-images.yml
        uses: liquibase/build-logic/.github/actions/dispatch-and-wait@2660ba32055efd3301bcf624a3d60ca8b11cc482 # main
        with:
          workflow: scan-published-images.yml
          repo: liquibase/liquibase-platform
          ref: main
          wait: 'false'
          gh-token: ${{ steps.get-token.outputs.token }}
