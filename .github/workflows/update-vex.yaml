name: Update VEX Documents

on:
  repository_dispatch:
    types: [vex-assessments-updated]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

# Runs share the automation/update-vex branch and each builds from main as of
# its own checkout, so overlapping runs produce PRs that conflict with each
# other. Queue them instead; each queued run checks out the main left by the last.
concurrency:
  group: update-vex
  cancel-in-progress: false

jobs:
  update-vex:
    name: Generate and update VEX content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vex-repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa # v3.0.0
        with:
          secret-ids: |
            LIQUIBASE,/vault/liquibase
          parse-json-secrets: true

      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ env.LIQUIBASE_LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout liquibase-pro (sparse)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: liquibase/liquibase-pro
          token: ${{ steps.get-token.outputs.token }}
          path: liquibase-pro
          sparse-checkout: |
            vex
          sparse-checkout-cone-mode: true

      - name: Checkout liquibase-insights (sparse)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: liquibase/liquibase-insights
          token: ${{ steps.get-token.outputs.token }}
          path: liquibase-insights
          sparse-checkout: |
            vex
          sparse-checkout-cone-mode: true

      - name: Install vexctl
        run: |
          sudo curl -sSfL "https://github.com/openvex/vexctl/releases/download/v0.3.0/vexctl-linux-amd64" -o /usr/local/bin/vexctl
          echo "cd7f8b57d20642166ed4eb3dd1fd849bbb30bbd7c5b9f5b0316b6003b57ceaba  /usr/local/bin/vexctl" | sha256sum -c -
          sudo chmod +x /usr/local/bin/vexctl
          vexctl version

      - name: Install yq
        run: |
          sudo curl -sSfL "https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64" -o /usr/local/bin/yq
          echo "0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # repo-content/ is committed by every update PR, so it starts out holding the last run's insights documents.
      - name: Generate VEX repo content
        run: |
          rm -rf ./repo-content
          bash liquibase-pro/vex/generate-vex-repo.sh \
            --output-dir ./repo-content \
            --assessments liquibase-pro/vex/assessments.yaml

      # Scoped to the four platform images, in GHCR and in the customer registry, so these statements never apply to
      # other images that ship the same packages. A failure here must not block Secure's VEX, so it falls back below.
      - name: Generate liquibase-insights VEX content
        id: insights
        continue-on-error: true
        run: |
          ghcr() { echo "pkg:oci/liquibase-platform-$1?repository_url=ghcr.io%2Fliquibase%2Fliquibase-platform-$1"; }
          customer() { echo "pkg:oci/liquibase-platform-$1?repository_url=registry.liquibase.com%2Fliquibase-platform-$1"; }
          bash liquibase-pro/vex/generate-vex-repo.sh \
            --output-dir "$RUNNER_TEMP/insights-content" \
            --assessments liquibase-insights/vex/assessments.yaml \
            --alias-cache liquibase-insights/vex/alias-cache.json \
            --product "$(ghcr api)" \
            --extra-product "$(ghcr web)" \
            --extra-product "$(ghcr migrate)" \
            --extra-product "$(ghcr llt)" \
            --extra-product "$(customer api)" \
            --extra-product "$(customer web)" \
            --extra-product "$(customer migrate)" \
            --extra-product "$(customer llt)" \
            --no-subcomponent-docs

      # Republishing the last good insights documents keeps their suppressions live until the insights input is fixed.
      - name: Keep published liquibase-insights content
        if: steps.insights.outcome == 'failure'
        run: |
          echo "::warning::liquibase-insights VEX generation failed; republishing its last published content so liquibase-pro still updates"
          INSIGHTS="$RUNNER_TEMP/insights-content"
          rm -rf "$INSIGHTS"
          mkdir -p "$INSIGHTS/pkg"
          jq '.packages |= map(select(.id | startswith("pkg:oci/liquibase-platform-")))' index.json > "$INSIGHTS/index.json"
          jq -r '.packages[].location' "$INSIGHTS/index.json" | sort -u | while read -r loc; do
            mkdir -p "$INSIGHTS/$(dirname "$loc")"
            cp -R "$(dirname "$loc")/." "$INSIGHTS/$(dirname "$loc")/"
          done

      # Trivy reads one index per repo, so a path or PURL present in both sources would silently shadow the other.
      - name: Merge liquibase-insights content
        run: |
          INSIGHTS="$RUNNER_TEMP/insights-content"
          clashes=$(cd "$INSIGHTS" && find pkg -type f -exec test -e "$GITHUB_WORKSPACE/repo-content/{}" \; -print)
          if [[ -n "$clashes" ]]; then
            echo "::error::liquibase-insights content collides with liquibase-pro content: $clashes"
            exit 1
          fi
          cp -R "$INSIGHTS/pkg/." repo-content/pkg/
          jq -s '.[0].packages += .[1].packages | .[0]
            | if (.packages | map(.id) | length) != (.packages | map(.id) | unique | length)
              then error("duplicate PURL ids across liquibase-pro and liquibase-insights") else . end' \
            repo-content/index.json "$INSIGHTS/index.json" > "$RUNNER_TEMP/merged-index.json"
          mv "$RUNNER_TEMP/merged-index.json" repo-content/index.json
          echo "Merged $(jq '.packages | length' "$INSIGHTS/index.json") liquibase-insights index entries; total $(jq '.packages | length' repo-content/index.json)"

      - name: Validate VEX repo
        run: bash liquibase-pro/vex/validate-vex-repo.sh ./repo-content

      - name: Copy generated content to repo root
        run: |
          # Copy generated files, preserving directory structure
          cp -f ./repo-content/vex-repository.json ./vex-repository.json
          cp -f ./repo-content/index.json ./index.json
          # Copy the package directory tree
          rm -rf ./pkg
          cp -r ./repo-content/pkg ./pkg

      # App tokens expire after 1 hour and generation now takes about that long, so the push needs a fresh one.
      - name: Get GitHub App token for the pull request
        id: get-pr-token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ env.LIQUIBASE_LIQUIBASE_GITHUB_APP_ID }}
          private-key: ${{ env.LIQUIBASE_LIQUIBASE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: vex-repo
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.get-pr-token.outputs.token }}
          commit-message: "chore: update VEX documents from liquibase-pro and liquibase-insights assessments"
          title: "chore: update VEX documents"
          body: |
            Automated update from `liquibase-pro/vex/assessments.yaml` and
            `liquibase-insights/vex/assessments.yaml`.

            This PR was generated by the `update-vex` workflow. The content is
            already validated by `validate-vex-repo.sh` before this PR is
            opened, and the canonical review happens on each `assessments.yaml`
            in its source repo, so this generated artifact is merged automatically
            to keep the published VEX in sync with the assessments.
          branch: automation/update-vex
          delete-branch: true

      # Merge automatically so the published VEX never lags behind
      # assessments.yaml. A stale VEX repo lets the scanner re-report CVEs that
      # already have not_affected/fixed assessments, which surfaces false
      # positives on the security portal. `main` has no required checks, so we
      # merge directly rather than using GitHub's auto-merge feature (which
      # refuses to enable on an already-mergeable PR). Conditioned on the PR
      # actually existing — create-pull-request is a no-op when there are no
      # content changes.
      - name: Auto-merge VEX update PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.get-pr-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --repo "$REPO"
