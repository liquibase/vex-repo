name: Notify Slack on workflow failure

# Catch-all: fires when any workflow in this repo completes, alerts only on
# failure. Cancelled and skipped runs are ignored. TECHOPS-1368.

on:
  workflow_run:
    workflows: ["**"]
    types: [completed]

permissions:
  id-token: write
  actions: read

jobs:
  notify:
    name: Notify Slack
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name != github.workflow
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        # TECHOPS-1299 moves this to /vault/grouped/team-liquibase-secure-slack-webhook.
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            LIQUIBASE,/vault/liquibase
          parse-json-secrets: true

      - name: Find the failed step
        id: failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # "job / step" for every failed step in the run. $job is jq, not shell.
          # shellcheck disable=SC2016
          STEPS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .name as $job
                  | .steps[] | select(.conclusion == "failure") | "\($job) / \(.name)"' \
            | paste -sd ';' - | sed 's/;/; /g')
          echo "steps=${STEPS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        env:
          WEBHOOK: ${{ env.LIQUIBASE_TEAM_LIQUIBASE_SECURE_SLACK_WEBHOOK }}
          FAILED_STEPS: ${{ steps.failed.outputs.steps }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK" ]]; then
            echo "::error::LIQUIBASE_TEAM_LIQUIBASE_SECURE_SLACK_WEBHOOK is unset; nothing sent."
            exit 1
          fi
          TITLE="❌ ${REPO}: ${WORKFLOW} failed"
          TEXT=$(printf '%s\n' \
            "Failed step: ${FAILED_STEPS}" \
            "Trigger: ${EVENT} on ${BRANCH} by ${ACTOR}" \
            "<${RUN_URL}|View run>")
          curl -fsS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg text "$TEXT" \
              --arg footer "$REPO" \
              '{attachments: [{color: "danger", title: $title, text: $text, fallback: $text, footer: $footer}]}')"
